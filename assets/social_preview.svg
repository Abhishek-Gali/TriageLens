<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#09101D"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131E36"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Subtle Glow Circles -->
  <circle cx="190" cy="180" r="240" fill="#0EA5E9" opacity="0.07"/>
  <circle cx="1060" cy="460" r="280" fill="#6366F1" opacity="0.07"/>

  <!-- Outer Frame Border -->
  <rect x="28" y="28" width="1224" height="584" rx="18" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="28" y="28" width="1224" height="4" rx="2" fill="url(#accentCyan)"/>

  <!-- ================= LEFT COLUMN: BRAND & FDE ARCHITECTURE ================= -->

  <!-- TriageLens Shield + Lens Emblem -->
  <g transform="translate(72, 74)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2"/>
    <path d="M44 16 L68 26 L68 46 C68 61 57 71 44 76 C31 71 20 61 20 46 L20 26 Z"
          fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="42" cy="43" r="11" fill="none" stroke="#A5B4FC" stroke-width="2.5"/>
    <line x1="50" y1="51" x2="58" y2="59" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 43 L40 47 L48 39" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & FDE + Cybersecurity Badge -->
  <text x="180" y="118" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="45" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Triage<tspan fill="#38BDF8">Lens</tspan>
  </text>
  <rect x="438" y="88" width="214" height="32" rx="16" fill="#17203D" stroke="#6366F1" stroke-width="1.5"/>
  <text x="545" y="109" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13.5" font-weight="700" fill="#A5B4FC">
    FDE + CYBERSECURITY
  </text>

  <text x="180" y="150" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="17.5" font-weight="600" fill="#94A3B8">
    Forward Deployed Engineering &amp; Bounded AI Alert Triage
  </text>

  <!-- Value Proposition Description -->
  <text x="72" y="204" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="15" fill="#CBD5E1">
    Built for air-gapped &amp; high-trust FDE deployments: strict JSONL data contracts,
  </text>
  <text x="72" y="230" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="15" fill="#CBD5E1">
    deterministic triage rules, escalation-only ML, and injection-safe local LLM fallback.
  </text>

  <!-- 3 Architecture Pillar Cards (Left Side) -->
  <!-- Card 1: FDE Data Contracts & Deterministic Policy -->
  <g transform="translate(72, 264)">
    <rect width="580" height="76" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#38BDF8"/>
    <text x="24" y="30" font-family="'Segoe UI', Inter, sans-serif" font-size="16.5" font-weight="700" fill="#F8FAFC">
      1. FDE Data Contracts &amp; Deterministic Rules
    </text>
    <text x="435" y="30" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#38BDF8">
      --mode baseline
    </text>
    <text x="24" y="55" font-family="'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#94A3B8">
      Fail-closed schema validation &#8226; Atomic staging &#8226; ~2,200 alerts/sec (0 deps)
    </text>
  </g>

  <!-- Card 2: Advisory ML Classifier -->
  <g transform="translate(72, 354)">
    <rect width="580" height="76" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#A855F7"/>
    <text x="24" y="30" font-family="'Segoe UI', Inter, sans-serif" font-size="16.5" font-weight="700" fill="#F8FAFC">
      2. Escalation-Only Advisory ML (Guardrailed)
    </text>
    <text x="435" y="30" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#C084FC">
      --mode ml
    </text>
    <text x="24" y="55" font-family="'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#94A3B8">
      Verified JSON linear model &#8226; Escalates disagreements to needs_review &#8226; No pickle
    </text>
  </g>

  <!-- Card 3: Local Loopback LLM Summarizer -->
  <g transform="translate(72, 444)">
    <rect width="580" height="76" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#10B981"/>
    <text x="24" y="30" font-family="'Segoe UI', Inter, sans-serif" font-size="16.5" font-weight="700" fill="#F8FAFC">
      3. Contained Local LLM Summarizer (Loopback)
    </text>
    <text x="435" y="30" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#34D399">
      --mode ai
    </text>
    <text x="24" y="55" font-family="'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#94A3B8">
      qwen2.5:1.5b via 127.0.0.1 &#8226; Strips untrusted source_text &#8226; Auto template fallback
    </text>
  </g>

  <!-- Bottom Disposition Chips -->
  <g transform="translate(72, 544)">
    <rect x="0" y="0" width="142" height="34" rx="8" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="5" fill="#EF4444"/>
    <text x="32" y="22" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#FCA5A5">suspicious</text>

    <rect x="156" y="0" width="160" height="34" rx="8" fill="#09261E" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="174" cy="17" r="5" fill="#10B981"/>
    <text x="188" y="22" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#6EE7B7">likely_benign</text>

    <rect x="330" y="0" width="156" height="34" rx="8" fill="#291D09" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="348" cy="17" r="5" fill="#F59E0B"/>
    <text x="362" y="22" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#FCD34D">needs_review</text>

    <rect x="500" y="0" width="152" height="34" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
    <text x="576" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#E2E8F0">Offline-First</text>
  </g>

  <!-- ================= RIGHT COLUMN: TERMINAL PREVIEW WINDOW ================= -->
  <g transform="translate(684, 74)">
    <!-- Terminal Window Frame -->
    <rect width="524" height="504" rx="14" fill="#090D16" stroke="#334155" stroke-width="1.8"/>
    <!-- Terminal Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 510 0 Q 524 0 524 14 L 524 42 L 0 42 Z" fill="#131C2E"/>
    <circle cx="22" cy="21" r="6" fill="#EF4444"/>
    <circle cx="42" cy="21" r="6" fill="#F59E0B"/>
    <circle cx="62" cy="21" r="6" fill="#10B981"/>
    <text x="262" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">
      triagelens &#8212; --mode ai --optional-mode strict
    </text>

    <!-- Terminal Content -->
    <text x="22" y="72" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#38BDF8">
      $ python -m triagelens -i alerts.jsonl -o runs/out --mode ai
    </text>
    <text x="22" y="94" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#64748B">
      [triagelens] mode=ai classifier=True summarizer=True status=complete
    </text>

