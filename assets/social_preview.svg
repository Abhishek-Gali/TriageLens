    <line x1="22" y1="108" x2="502" y2="108" stroke="#1E293B" stroke-width="1"/>

    <!-- JSON Record Preview -->
    <text x="22" y="132" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#94A3B8">{</text>

    <text x="38" y="156" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"alert_id"</text>
    <text x="122" y="156" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: </text>
    <text x="136" y="156" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#A7F3D0">"hold2-auth-012"</text>
    <text x="268" y="156" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#64748B">, //authentication</text>

    <text x="38" y="180" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"processing_status"</text>
    <text x="190" y="180" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: </text>
    <text x="204" y="180" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6EE7B7">"accepted"</text>
    <text x="286" y="180" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">,</text>

    <text x="38" y="204" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"baseline_disposition"</text>
    <text x="214" y="204" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: </text>
    <text x="228" y="204" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#FCA5A5">"suspicious"</text>
    <text x="326" y="204" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">,</text>

    <text x="38" y="228" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"disposition"</text>
    <text x="142" y="228" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: </text>
    <text x="156" y="228" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#FCD34D" font-weight="700">"needs_review"</text>
    <text x="270" y="228" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">,</text>

    <text x="38" y="252" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"matched_rule_ids"</text>
    <text x="182" y="252" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: [</text>
    <text x="204" y="252" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#FDE68A">"AUTH-S01"</text>
    <text x="286" y="252" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">],</text>

    <text x="38" y="276" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"review_reasons"</text>
    <text x="166" y="276" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: [</text>
    <text x="188" y="276" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#C084FC">"classifier_disagreement"</text>
    <text x="392" y="276" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">],</text>

    <text x="38" y="302" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"optional_classifier"</text>
    <text x="206" y="302" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: {</text>
    <text x="56" y="324" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#CBD5E1">"model_id": "triagelens-logreg-l2-v1",</text>
    <text x="56" y="344" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#CBD5E1">"predicted_class": "likely_benign",</text>
    <text x="56" y="364" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#CBD5E1">"score_semantics": "uncalibrated"</text>
    <text x="38" y="384" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">},</text>

    <text x="38" y="408" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">"summary"</text>
    <text x="110" y="408" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">: {</text>
    <text x="56" y="430" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#CBD5E1">"source": "local_llm",</text>
    <text x="56" y="450" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#34D399">"validation_state": "valid",</text>
    <text x="56" y="470" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#CBD5E1">"version": "explain-v1+qwen2.5:1.5b"</text>
    <text x="38" y="488" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#E2E8F0">}</text>
    <text x="22" y="500" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#94A3B8">}</text>
  </g>
</svg>
